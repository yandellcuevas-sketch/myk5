<!DOCTYPE html>
<html lang="es" data-view="dashboard">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="My K5 — Dashboard personal para tu Kia K5" />
  <meta name="theme-color" content="#0A0A0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My K5" />
  <meta name="mobile-web-app-capable" content="yes" />

  <title>My K5</title>

  <!-- PWA icons -->
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- CSS -->
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>

<div id="app">

  <!-- ══════════════════════════════════════════════════
       VIEW: DASHBOARD
  ══════════════════════════════════════════════════ -->
  <section id="view-dashboard" class="view active">
    <!-- Dashboard header -->
    <div class="dashboard-header">
      <div class="dashboard-header-top">
        <div class="dashboard-brand">
          <span class="dashboard-brand-name" id="dash-nickname">My K5</span>
        </div>
        <div class="dashboard-header-actions">
          <button class="btn-icon" id="dash-settings-btn" title="Mi K5">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9C2.1 11.1 2 11.5 2 12v4c0 .6.4 1 1 1h2"/>
              <circle cx="7" cy="17" r="2"/>
              <circle cx="17" cy="17" r="2"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div class="scroll-content">
      <!-- Hero car -->
      <div class="dashboard-hero">
        <div class="hero-car-wrap">
          <img id="dash-car-img" class="hero-car" src="assets/images/k5.png" alt="Kia K5"
               onerror="this.style.display='none'; document.getElementById('dash-car-placeholder').style.display='flex';" />
          <div id="dash-car-placeholder" class="hero-car-placeholder" style="display:none;">
            <span style="font-size:4rem;">🚗</span>
            <span style="color:var(--text-muted);font-size:0.875rem;">Imagen no disponible</span>
          </div>
        </div>
        <!-- Km display -->
        <div class="hero-km-wrap">
          <span class="hero-km" id="dash-km">0 km</span>
          <span class="hero-km-label">Kilometraje actual</span>
        </div>
      </div>

      <!-- Month summary -->
      <div class="dashboard-month-card">
        <div class="month-card-header">
          <div>
            <div class="month-label" id="dash-month-label">AGOSTO</div>
            <div class="month-amount" id="dash-month-amount">RD$ 0</div>
            <div class="month-sub">Gastos este mes</div>
          </div>
          <div id="dash-month-trend"></div>
        </div>
      </div>

      <!-- Alerts -->
      <div id="dash-alerts" class="dash-alerts"></div>

      <!-- Metric cards grid -->
      <div class="grid-2 stagger-children" id="dash-metrics">
        <!-- Generated by dashboard.js -->
      </div>

      <div style="height: var(--space-lg);"></div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════
       VIEW: HISTORY
  ══════════════════════════════════════════════════ -->
  <section id="view-history" class="view">
    <div class="section-header">
      <div>
        <h1 class="section-title">Historial</h1>
        <p class="section-subtitle" id="history-count-label"></p>
      </div>
    </div>

    <!-- Filter chips -->
    <div class="chips-scroll" style="padding: 0 var(--space-md) var(--space-sm);" id="history-filters">
      <button class="chip active" data-filter="all">Todo</button>
      <button class="chip" data-filter="fuel">⛽ Gasolina</button>
      <button class="chip" data-filter="maintenance">🔧 Mantenimiento</button>
      <button class="chip" data-filter="wash">🧽 Lavados</button>
      <button class="chip" data-filter="expenses">💰 Gastos</button>
      <button class="chip" data-filter="trips">🛣 Viajes</button>
    </div>

    <div class="scroll-content">
      <div class="timeline" id="history-timeline">
        <!-- Generated by history.js -->
      </div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════
       VIEW: STATISTICS
  ══════════════════════════════════════════════════ -->
  <section id="view-statistics" class="view">
    <div class="section-header">
      <div>
        <h1 class="section-title">Estadísticas</h1>
        <p class="section-subtitle">Costo real de tu K5</p>
      </div>
    </div>

    <!-- Period selector -->
    <div class="period-selector" id="stats-period-selector">
      <button class="period-btn active" data-period="month">Este mes</button>
      <button class="period-btn" data-period="year">Este año</button>
      <button class="period-btn" data-period="all">Todo</button>
    </div>

    <div class="scroll-content" id="stats-content">
      <!-- Generated by statistics.js -->
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════
       VIEW: MY K5 (Vehicle profile + settings)
  ══════════════════════════════════════════════════ -->
  <section id="view-vehicle" class="view">
    <div class="section-header">
      <div>
        <h1 class="section-title" id="vehicle-title">My K5</h1>
        <p class="section-subtitle" id="vehicle-subtitle">Perfil del vehículo</p>
      </div>
      <button class="btn btn-sm btn-secondary" id="vehicle-edit-btn">Editar</button>
    </div>

    <div class="scroll-content">
      <!-- Vehicle hero image -->
      <div class="vehicle-hero">
        <img id="vehicle-img" src="assets/images/k5.png" alt="Mi K5"
             onerror="this.style.display='none'; document.getElementById('vehicle-img-placeholder').style.display='flex';" />
        <div id="vehicle-img-placeholder" class="vehicle-hero-placeholder" style="display:none;">
          <span class="vehicle-hero-placeholder-icon">🚗</span>
          <span style="color:var(--text-muted);font-size:0.875rem;">Sin imagen</span>
        </div>
        <label class="vehicle-hero-change" for="vehicle-photo-input">📷 Cambiar foto</label>
        <input type="file" id="vehicle-photo-input" accept="image/*" style="display:none;" />
      </div>

      <!-- Stats grid -->
      <div class="vehicle-stats-grid" id="vehicle-stats-grid">
        <!-- Generated by vehicle.js -->
      </div>

      <!-- Settings list -->
      <div class="section-divider">Ajustes del vehículo</div>
      <div class="settings-list" id="vehicle-settings-list">
        <!-- Generated by vehicle.js -->
      </div>

      <!-- Backup section -->
      <div class="section-divider">Datos y backup</div>
      <div class="settings-list">
        <button class="settings-item" id="btn-export-json">
          <span class="settings-item-icon">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </span>
          <div class="settings-item-body">
            <div class="settings-item-label">Exportar backup</div>
            <div class="settings-item-sub">Descarga my-k5-backup.json</div>
          </div>
          <span class="settings-item-arrow">›</span>
        </button>
        <button class="settings-item" id="btn-export-csv">
          <span class="settings-item-icon">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <path d="M8 13h2"/>
              <path d="M8 17h8"/>
              <path d="M14 13h2"/>
            </svg>
          </span>
          <div class="settings-item-body">
            <div class="settings-item-label">Exportar CSV</div>
            <div class="settings-item-sub">Historial en hoja de cálculo</div>
          </div>
          <span class="settings-item-arrow">›</span>
        </button>
        <label class="settings-item" style="cursor:pointer;">
          <span class="settings-item-icon">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </span>
          <div class="settings-item-body">
            <div class="settings-item-label">Importar backup</div>
            <div class="settings-item-sub">Restaura desde un archivo .json</div>
          </div>
          <span class="settings-item-arrow">›</span>
          <input type="file" id="btn-import-json" accept=".json" style="display:none;" />
        </label>
        <button class="settings-item" id="btn-update-km">
          <span class="settings-item-icon">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10"/>
              <path d="M12 12l4-4"/>
              <circle cx="12" cy="12" r="2"/>
            </svg>
          </span>
          <div class="settings-item-body">
            <div class="settings-item-label">Actualizar kilometraje</div>
            <div class="settings-item-sub">Corrección manual del odómetro</div>
          </div>
          <span class="settings-item-arrow">›</span>
        </button>
      </div>

      <!-- Demo data -->
      <div class="settings-list" id="demo-section">
        <button class="settings-item" id="btn-load-demo">
          <span class="settings-item-icon">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v4"/>
              <path d="m4.93 4.93 2.83 2.83"/>
              <path d="M2 12h4"/>
              <path d="m4.93 19.07 2.83-2.83"/>
              <path d="M12 18v4"/>
              <path d="m19.07 19.07-2.83-2.83"/>
              <path d="M18 12h4"/>
              <path d="m19.07 4.93-2.83 2.83"/>
            </svg>
          </span>
          <div class="settings-item-body">
            <div class="settings-item-label">Cargar datos demo</div>
            <div class="settings-item-sub">Ver cómo se ve la app con datos</div>
          </div>
          <span class="settings-item-arrow">›</span>
        </button>
        <button class="settings-item" id="btn-clear-demo" style="display:none;">
          <span class="settings-item-icon">
            <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </span>
          <div class="settings-item-body">
            <div class="settings-item-label">Eliminar datos demo</div>
            <div class="settings-item-sub">Solo elimina los datos de prueba</div>
          </div>
          <span class="settings-item-arrow">›</span>
        </button>
      </div>

      <div style="height: var(--space-lg);"></div>
    </div>
  </section>

  <!-- ══════════════════════════════════════════════════
       BOTTOM NAVIGATION
  ══════════════════════════════════════════════════ -->
  <nav id="bottom-nav">
    <button class="nav-item active" data-nav="dashboard">
      <span class="nav-icon">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9.5z"/>
          <path d="M9 22V12h6v10"/>
        </svg>
      </span>
      <span class="nav-label">Inicio</span>
    </button>
    <button class="nav-item" data-nav="history">
      <span class="nav-icon">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </span>
      <span class="nav-label">Historial</span>
    </button>

    <!-- FAB (center) -->
    <button class="nav-fab" id="fab-btn">
      <div class="nav-fab-inner">
        <i class="fab-icon">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </i>
      </div>
      <span class="nav-label">Registrar</span>
    </button>

    <button class="nav-item" data-nav="statistics">
      <span class="nav-icon">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 20V10"/>
          <path d="M12 20V4"/>
          <path d="M6 20v-6"/>
        </svg>
      </span>
      <span class="nav-label">Estadísticas</span>
    </button>
    <button class="nav-item" data-nav="vehicle">
      <span class="nav-icon">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9C2.1 11.1 2 11.5 2 12v4c0 .6.4 1 1 1h2"/>
          <circle cx="7" cy="17" r="2"/>
          <circle cx="17" cy="17" r="2"/>
          <path d="M5 17h10"/>
        </svg>
      </span>
      <span class="nav-label">Mi K5</span>
    </button>
  </nav>

  <!-- FAB overlay -->
  <div id="fab-overlay"></div>

  <!-- FAB menu -->
  <div id="fab-menu">
    <div class="fab-menu-handle"></div>
    <div class="fab-menu-title">Registrar</div>
    <div class="fab-menu-items">
      <button class="fab-menu-item" data-action="fuel">
        <div class="fab-menu-item-emoji" style="background:rgba(245,158,11,0.12);color:var(--color-fuel);">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 22V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v17"/>
            <path d="M15 10h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2 2 2 0 0 0 2-2V9.8a2 2 0 0 0-.6-1.4L20.5 6.5"/>
            <path d="M3 11h12"/>
            <path d="M6 7h6"/>
          </svg>
        </div>
        <div class="fab-menu-item-text">
          <span class="fab-menu-item-label">Gasolina</span>
          <span class="fab-menu-item-desc">Registrar carga de combustible</span>
        </div>
      </button>
      <button class="fab-menu-item" data-action="wash">
        <div class="fab-menu-item-emoji" style="background:rgba(59,130,246,0.12);color:var(--color-wash);">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.7L6.3 8.4a8 8 0 1 0 11.4 0L12 2.7z"/>
          </svg>
        </div>
        <div class="fab-menu-item-text">
          <span class="fab-menu-item-label">Lavado</span>
          <span class="fab-menu-item-desc">Registrar lavado del vehículo</span>
        </div>
      </button>
      <button class="fab-menu-item" data-action="maintenance">
        <div class="fab-menu-item-emoji" style="background:rgba(16,185,129,0.12);color:var(--color-maint);">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9l-3.8 3.8z"/>
          </svg>
        </div>
        <div class="fab-menu-item-text">
          <span class="fab-menu-item-label">Mantenimiento</span>
          <span class="fab-menu-item-desc">Aceite, gomas, batería y más</span>
        </div>
      </button>
      <button class="fab-menu-item" data-action="expense">
        <div class="fab-menu-item-emoji" style="background:rgba(139,92,246,0.12);color:var(--color-expense);">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <line x1="2" y1="10" x2="22" y2="10"/>
            <line x1="6" y1="15" x2="10" y2="15"/>
          </svg>
        </div>
        <div class="fab-menu-item-text">
          <span class="fab-menu-item-label">Otro gasto</span>
          <span class="fab-menu-item-desc">Peaje, seguro, marbete, etc.</span>
        </div>
      </button>
      <button class="fab-menu-item" data-action="trip">
        <div class="fab-menu-item-emoji" style="background:rgba(236,72,153,0.12);color:var(--color-trip);">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="19" r="3"/>
            <circle cx="18" cy="5" r="3"/>
            <path d="M12 19h4.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H12"/>
          </svg>
        </div>
        <div class="fab-menu-item-text">
          <span class="fab-menu-item-label">Viaje</span>
          <span class="fab-menu-item-desc">Guardar un viaje especial</span>
        </div>
      </button>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════════
       MODALES (se generan dinámicamente desde JS)
  ══════════════════════════════════════════════════ -->
  <div id="modal-container"></div>

</div><!-- /#app -->

<!-- Chart.js (lazy, cargado cuando se abre Estadísticas) -->
<script>
  window.CHART_JS_URL = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
  window.APP_BASE = (function() {
    // Detect base path for GitHub Pages compatibility
    const scripts = document.querySelectorAll('script[src]');
    const path = window.location.pathname;
    // If at root or a direct file, base is '/'
    if (path === '/' || path.endsWith('.html')) return './';
    // Otherwise assume we're at base
    return './';
  })();
</script>

<!-- Core modules (order matters) -->
<script src="js/icons.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/db.js"></script>

<!-- Feature modules -->
<script src="js/dashboard.js"></script>
<script src="js/fuel.js"></script>
<script src="js/wash.js"></script>
<script src="js/maintenance.js"></script>
<script src="js/expenses.js"></script>
<script src="js/trips.js"></script>
<script src="js/history.js"></script>
<script src="js/statistics.js"></script>
<script src="js/vehicle.js"></script>
<script src="js/backup.js"></script>

<!-- App init -->
<script src="js/app.js"></script>

<!-- Dashboard specific styles -->
<style>
  /* Dashboard hero styles inline for paint speed */
  .dashboard-header {
    padding: calc(var(--space-md) + var(--safe-top)) var(--space-md) var(--space-sm);
  }

  .dashboard-header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .dashboard-brand-name {
    font-size: 1.25rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--text-primary);
  }

  .dashboard-hero {
    padding: var(--space-sm) 0 0;
  }

  .hero-car-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/8;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-car {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 0 var(--space-md);
    filter: drop-shadow(0 8px 32px rgba(0,0,0,0.6));
  }

  .hero-car-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    width: 100%;
    height: 100%;
  }

  .hero-km-wrap {
    text-align: center;
    padding: var(--space-sm) 0 var(--space-md);
  }

  .hero-km {
    display: block;
    font-size: 2.5rem;
    font-weight: 900;
    letter-spacing: -0.04em;
    color: var(--text-primary);
    line-height: 1;
  }

  .hero-km-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 4px;
    display: block;
  }

  .dashboard-month-card {
    background: linear-gradient(135deg, rgba(200,168,75,0.08) 0%, transparent 60%);
    border: 1px solid rgba(200,168,75,0.15);
    border-radius: var(--radius-lg);
    padding: var(--space-md) var(--space-lg);
    margin-bottom: var(--space-md);
  }

  .month-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }

  .month-label {
    font-size: 0.6875rem;
